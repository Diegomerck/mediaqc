[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mediaqc-engine"
version = "0.0.0"
description = "MediaQC offline local engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.1",
    "scipy==1.17.0",
    "opencv-python-headless==4.13.0.92",
    "reportlab==4.4.10",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
    "pyinstaller==6.19.0",
    "ruff==0.15.0",
    "pypdf==6.9.1",
]

[tool.uv]
required-version = "==0.12.12"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/mediaqc_engine"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["engine/src"]
extend-exclude = [".tools", ".cache", "apps/desktop/src-tauri/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine/src", "engine/tests", "engine/entrypoint.py", "tools/build_engine.py", "tools/smoke_engine.py", "tools/smoke_lifecycle.py", "tools/prepare_media_tools.py", "tools/smoke_phase2.py", "tools/smoke_phase4.py", "tools/smoke_phase5.py", "tools/generate_test_media", "apps/desktop/src-tauri/tests/fixtures/engine_stub.py"]
mypy_path = ["tools"]
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["engine/tests"]
pythonpath = ["tools"]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
filterwarnings = ["error"]
