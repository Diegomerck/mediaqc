name: Desktop Field Release (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --locked

      - name: Prepare media tools
        run: uv run python tools/prepare_media_tools.py

      - name: Install Node dependencies
        run: npm ci

      - name: Test frontend
        run: npm test --workspace @mediaqc/frontend

      - name: Build frontend
        run: npm run build --workspace @mediaqc/frontend

      - name: Build Python engine
        run: uv run python tools/build_engine.py

      - name: Build Tauri desktop
        run: npx @tauri-apps/cli build --config apps/desktop/src-tauri/tauri.prepared.conf.json

      - name: Package Windows installer bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows"
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle" -Recurse -Include *.exe, *.msi | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist/windows" -Force
          }
          Get-ChildItem -Path "dist/windows"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaQC-Windows
          path: dist/windows/*
          retention-days: 7

  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Apple-Silicon
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --locked

      - name: Prepare media tools (macOS)
        run: uv run python tools/prepare_media_tools.py --platform macos

      - name: Install Node dependencies
        run: npm ci

      - name: Test frontend
        run: npm test --workspace @mediaqc/frontend

      - name: Build frontend
        run: npm run build --workspace @mediaqc/frontend

      - name: Build Python engine
        run: uv run python tools/build_engine.py

      - name: Build Tauri desktop
        run: npx @tauri-apps/cli build --target ${{ matrix.target }} --config apps/desktop/src-tauri/tauri.prepared.conf.json

      - name: Package macOS installer bundle
        run: |
          mkdir -p dist/macos
          find apps/desktop/src-tauri/target -name "*.dmg" -exec cp {} dist/macos/ \;
          ls -la dist/macos

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaQC-macOS-${{ matrix.name }}
          path: dist/macos/*
          retention-days: 7

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="v0.1.0"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.1.0-build.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: MediaQC ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./dist/*.exe
            ./dist/*.msi
            ./dist/*.dmg
